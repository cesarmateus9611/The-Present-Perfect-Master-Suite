<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Present Perfect Master Suite v2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e272e; color: #d2dae2; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { color: #0be881; margin-bottom: 5px; font-size: 2.8rem; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #808e9b; margin-bottom: 20px; font-style: italic; font-size: 1.2rem; text-align: center; }
        
        /* Dashboard & Navigation */
        .dashboard { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; background: #34495e; padding: 15px 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-size: 1.2rem; font-weight: bold; box-sizing: border-box; }
        .stat { display: flex; align-items: center; gap: 10px; }
        .score { color: #f1c40f; }
        .lives { color: #ff3f34; }
        .btn-menu { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-menu:hover { background: #c0392b; }
        
        /* Main Container */
        .container { background: #ecf0f1; color: #2c3e50; padding: 40px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); max-width: 800px; width: 100%; text-align: center; position: relative; border-top: 8px solid #0be881; min-height: 350px; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
        
        .level-title { font-size: 1.5rem; color: #e67e22; margin-bottom: 20px; font-weight: 800; text-transform: uppercase; }
        .question-text { font-size: 24px; font-weight: bold; margin-bottom: 30px; line-height: 1.4; color: #2c3e50; }
        
        /* Level Selector Grid */
        .level-selector { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; max-width: 500px; margin: 0 auto; }
        .btn-level { background: #3498db; color: white; border: none; padding: 20px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 0 #2980b9; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .btn-level span { font-size: 14px; font-weight: normal; color: #ecf0f1; }
        .btn-level:hover { transform: translateY(3px); box-shadow: 0 2px 0 #2980b9; }
        .btn-level.lvl1 { background: #9b59b6; box-shadow: 0 5px 0 #8e44ad; }
        .btn-level.lvl2 { background: #e67e22; box-shadow: 0 5px 0 #d35400; }
        .btn-level.lvl3 { background: #1abc9c; box-shadow: 0 5px 0 #16a085; }

        /* Game Mechanics */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .btn-option { background: #34495e; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #2c3e50; }
        .btn-option:hover { transform: translateY(2px); box-shadow: 0 2px 0 #2c3e50; }
        
        /* Unscramble CSS */
        .word-bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .word-block { background: #f39c12; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; box-shadow: 0 3px 0 #d35400; transition: 0.1s; }
        .word-block:active { transform: translateY(2px); box-shadow: 0 1px 0 #d35400; }
        .answer-area { min-height: 60px; background: #bdc3c7; border: 3px dashed #7f8c8d; border-radius: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 10px; }
        
        /* Feedback */
        .feedback { font-size: 20px; font-weight: bold; margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .feedback.correct { background: #d5f5e3; color: #27ae60; border: 2px solid #2ecc71; }
        .feedback.incorrect { background: #fadbd8; color: #c0392b; border: 2px solid #e74c3c; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🎮 Present Perfect Suite</h1>
    <div class="subtitle">Select your challenge. Prove your Grammar Power!</div>

    <div class="dashboard hidden" id="dashboard">
        <button class="btn-menu" onclick="showMainMenu()">⬅ Main Menu</button>
        <div class="stat score">⭐ Score: <span id="score">0</span></div>
        <div class="stat lives">❤️ Lives: <span id="lives">3</span></div>
    </div>

    <div class="container" id="main-container">
        
        <!-- MAIN MENU (LEVEL SELECTOR) -->
        <div id="start-screen">
            <h2 style="color: #2c3e50; margin-top:0;">Select a Module:</h2>
            <div class="level-selector">
                <button class="btn-level lvl1" onclick="startLevel(1)">
                    LEVEL 1: Multiple Choice
                    <span>The rules of Ever & Never</span>
                </button>
                <button class="btn-level lvl2" onclick="startLevel(2)">
                    LEVEL 2: Syntax Builder
                    <span>Unscramble the experience</span>
                </button>
                <button class="btn-level lvl3" onclick="startLevel(3)">
                    LEVEL 3: Participle Memory
                    <span>Master irregular verbs</span>
                </button>
            </div>
        </div>

        <!-- Level 1 & 3: Multiple Choice Engine -->
        <div id="quiz-engine" class="hidden">
            <div class="level-title" id="quiz-title">Level Title</div>
            <div class="question-text" id="q-text-quiz">Loading...</div>
            <div class="options-grid" id="options-quiz"></div>
        </div>

        <!-- Level 2: Unscramble Engine -->
        <div id="unscramble-engine" class="hidden">
            <div class="level-title">Level 2: Syntax Builder</div>
            <div class="question-text" id="q-text-unscramble">Loading...</div>
            <div class="answer-area" id="answer-area"></div>
            <div class="word-bank" id="word-bank"></div>
            <button class="btn-option" style="width: 200px; margin: 0 auto; display: block; background: #27ae60; box-shadow: 0 4px 0 #2ecc71;" onclick="checkUnscramble()">Submit Sentence</button>
        </div>

        <!-- Feedback Box -->
        <div id="feedback-box" class="feedback"></div>
        
    </div>

    <script>
        // --- GAME DATA ---
        const level1Data = [
            { q: "________ she ________ sung in a community choir?", options: ["Have / ever", "Has / ever", "Has / never", "Have / never"], ans: "Has / ever" },
            { q: "I have ________ swum in a polluted river. I protect the water!", options: ["ever", "never", "haven't", "didn't"], ans: "never" },
            { q: "My friends ________ organized an eco-festival.", options: ["have", "has", "has ever", "have never ever"], ans: "have" }
        ];

        const level2Data = [
            { hint: "Make an affirmative sentence about a DJ.", words: ["Andrea", "has", "played", "electronic", "music", "in", "the", "park"], ans: "Andrea has played electronic music in the park" },
            { hint: "Make a question about an orchestra.", words: ["Have", "you", "ever", "listened", "to", "a", "classical", "orchestra", "?"], ans: "Have you ever listened to a classical orchestra ?" },
            { hint: "Make a negative sentence with NEVER.", words: ["My", "community", "has", "never", "cut", "down", "these", "trees"], ans: "My community has never cut down these trees" }
        ];

        const level3Data = [
            { q: "What is the Past Participle of RIDE?", options: ["Rided", "Rode", "Ridden", "Riding"], ans: "Ridden" },
            { q: "What is the Past Participle of SWIM?", options: ["Swam", "Swum", "Swimmed", "Swoming"], ans: "Swum" },
            { q: "What is the Past Participle of MEET?", options: ["Meeted", "Met", "Meet", "Mote"], ans: "Met" }
        ];

        // --- GAME VARIABLES ---
        let score = 0;
        let lives = 3;
        let activeLevel = 0;
        let qIndex = 0;
        let currentUnscrambleAns = [];
        let currentData = [];

        // --- CORE FUNCTIONS ---
        function showMainMenu() {
            document.getElementById("dashboard").classList.add("hidden");
            document.getElementById("quiz-engine").classList.add("hidden");
            document.getElementById("unscramble-engine").classList.add("hidden");
            document.getElementById("feedback-box").style.display = "none";
            document.getElementById("start-screen").classList.remove("hidden");
        }

        function startLevel(levelNum) {
            activeLevel = levelNum;
            qIndex = 0;
            lives = 3;
            updateDashboard();
            
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            
            if(levelNum === 1) {
                currentData = level1Data;
                document.getElementById("quiz-title").innerText = "Level 1: The Ever/Never Rules";
                loadQuiz();
            } else if(levelNum === 2) {
                currentData = level2Data;
                loadUnscramble();
            } else if(levelNum === 3) {
                currentData = level3Data;
                document.getElementById("quiz-title").innerText = "Level 3: Participle Memory";
                loadQuiz();
            }
        }

        function updateDashboard() {
            document.getElementById("score").innerText = score;
            document.getElementById("lives").innerText = lives;
            if (lives <= 0) gameOver(false);
        }

        function showFeedback(isCorrect, message, callback) {
            const box = document.getElementById("feedback-box");
            box.className = "feedback " + (isCorrect ? "correct" : "incorrect");
            box.innerHTML = isCorrect ? `✅ CORRECT! ${message}` : `❌ INCORRECT! ${message}`;
            box.style.display = "block";
            
            setTimeout(() => {
                box.style.display = "none";
                callback();
            }, 1800);
        }

        function gameOver(win) {
            const container = document.getElementById("main-container");
            document.getElementById("quiz-engine").classList.add("hidden");
            document.getElementById("unscramble-engine").classList.add("hidden");
            
            if (win) {
                showFeedback(true, "LEVEL COMPLETED! +500 Bonus", showMainMenu);
                score += 500;
                updateDashboard();
            } else {
                showFeedback(false, "OUT OF LIVES! Returning to menu...", showMainMenu);
            }
        }

        // --- QUIZ ENGINE (Levels 1 & 3) ---
        function loadQuiz() {
            document.getElementById("unscramble-engine").classList.add("hidden");
            document.getElementById("quiz-engine").classList.remove("hidden");
            
            if (qIndex >= currentData.length) {
                gameOver(true); 
                return;
            }

            const q = currentData[qIndex];
            document.getElementById("q-text-quiz").innerText = q.q;
            
            const optionsDiv = document.getElementById("options-quiz");
            optionsDiv.innerHTML = "";
            
            let opts = [...q.options].sort(() => Math.random() - 0.5);
            
            opts.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerText = opt;
                btn.onclick = () => checkQuiz(opt, q.ans);
                optionsDiv.appendChild(btn);
            });
        }

        function checkQuiz(selected, correct) {
            if (selected === correct) {
                score += 100;
                updateDashboard();
                showFeedback(true, "+100 Points!", () => { qIndex++; loadQuiz(); });
            } else {
                lives--;
                updateDashboard();
                if(lives > 0) showFeedback(false, `The correct answer was: ${correct}`, () => { qIndex++; loadQuiz(); });
            }
        }

        // --- UNSCRAMBLE ENGINE (Level 2) ---
        function loadUnscramble() {
            document.getElementById("quiz-engine").classList.add("hidden");
            document.getElementById("unscramble-engine").classList.remove("hidden");
            
            if (qIndex >= currentData.length) {
                gameOver(true); 
                return;
            }

            currentUnscrambleAns = [];
            const q = currentData[qIndex];
            document.getElementById("q-text-unscramble").innerText = `Hint: ${q.hint}`;
            
            const bank = document.getElementById("word-bank");
            const answerArea = document.getElementById("answer-area");
            bank.innerHTML = "";
            answerArea.innerHTML = "";

            let shuffledWords = [...q.words].sort(() => Math.random() - 0.5);

            shuffledWords.forEach(word => {
                let block = document.createElement("div");
                block.className = "word-block";
                block.innerText = word;
                block.onclick = () => moveToAnswer(block, word);
                bank.appendChild(block);
            });
        }

        function moveToAnswer(block, word) {
            const answerArea = document.getElementById("answer-area");
            const bank = document.getElementById("word-bank");
            
            if (block.parentElement === bank) {
                answerArea.appendChild(block);
                currentUnscrambleAns.push(word);
            } else {
                bank.appendChild(block);
                currentUnscrambleAns = currentUnscrambleAns.filter(w => w !== word);
            }
        }

        function checkUnscramble() {
            const q = currentData[qIndex];
            const userStr = currentUnscrambleAns.join(" ");
            
            if (userStr === q.ans) {
                score += 200;
                updateDashboard();
                showFeedback(true, "Perfect Syntax!", () => { qIndex++; loadUnscramble(); });
            } else {
                lives--;
                updateDashboard();
                if(lives > 0) showFeedback(false, "Syntax Error! Check your word order.", () => { loadUnscramble(); });
            }
        }
    </script>
</body>
</html>
